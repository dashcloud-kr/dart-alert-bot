[project]
name = "bot-kit"
version = "0.1.0"
description = "24/7 텔레그램 봇 스타터 킷 (python-telegram-bot + SQLite + pytest)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
